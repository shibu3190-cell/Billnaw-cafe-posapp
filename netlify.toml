# Netlify Production Deployment Configuration for Billnaw POS PWA
[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Set JWT_SECRET & GEMINI_API_KEY in Netlify Site Settings -> Environment Variables (never commit secrets in netlify.toml)
  # Keep standard Secrets Scanning enabled for JWT_SECRET, GEMINI_API_KEY, SMTP_PASS & SMTP_USER;
  # omit non-secret config keys ("smtp.gmail.com", port, boolean) and public Firebase Web API key smart-detection false positives.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,SMTP_PORT,SMTP_SECURE"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = "scratch/**,.agents/**,.env.example,memory.md"

[functions]
  node_bundler = "esbuild"

# API Serverless Functions Routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA Single Page App fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Never cache Service Worker so updates apply instantly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Never cache HTML entrypoint so versioned ?v= asset references always stay fresh
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Cache versioned JS/CSS/app modules aggressively with stale-while-revalidate (eliminates 304 storms on reload)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Unversioned ES modules in /src/* must revalidate with origin (SW serves them instantly via SWR)
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Cache static assets (fonts, icons, audio) for performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
